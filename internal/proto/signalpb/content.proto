// Signal's application content, the padded plaintext inside session
// ciphertexts. Written from spec/service/content.md §3-6, never copied
// from upstream. Only the fields signal-cli-go handles so far are
// declared; everything else is kept as unknown fields and survives
// re-encoding.
syntax = "proto2";

package signalcligo;

option go_package = "github.com/aren55555/signal-cli-go/internal/proto/signalpb";

// The top-level plaintext (§3). At most one of the oneof members is set;
// fields 7 and 10 may accompany any of them.
message AppContent {
  oneof body {
    AppDataMessage data_message = 1;
    AppSyncMessage sync_message = 2;
    AppNullMessage null_message = 4;
    AppReceipt receipt_message = 5;
    AppTyping typing_message = 6;
    bytes decryption_error_message = 8; // serialized DecryptionFailureReport
    AppEdit edit_message = 11;
    AppStoryMessage story_message = 9;
  }
  optional bytes sender_key_distribution_message = 7;
  optional AppPniSignature pni_signature_message = 10;
}

// §4.1.
message AppDataMessage {
  optional string body = 1;
  optional uint32 flags = 4;
  optional uint32 expire_timer = 5;
  optional bytes profile_key = 6;
  optional uint64 timestamp = 7; // must equal the envelope's client timestamp
  optional uint32 required_protocol_version = 12;
  optional bool is_view_once = 14;
  optional AppGroupContextV2 group_v2 = 15;
  repeated AppAttachmentPointer attachments = 2;
  optional AppQuote quote = 8;
  repeated AppSharedContact contact = 9;
  repeated AppPreview preview = 10;
  optional AppSticker sticker = 11;
  optional AppReaction reaction = 16;
  optional AppDelete delete = 17;
  repeated AppBodyRange body_ranges = 18;
  optional AppGroupCallUpdate group_call_update = 19;
  optional AppPayment payment = 20;
  optional AppStoryContext story_context = 21;
  optional AppGiftBadge gift_badge = 22;
  optional AppPollCreate poll_create = 24;
  optional AppPollTerminate poll_terminate = 25;
  optional AppPollVote poll_vote = 26;
  optional AppPinMessage pin_message = 27;
  optional AppUnpinMessage unpin_message = 28;
  optional AppAdminDelete admin_delete = 29;
  optional uint32 expire_timer_version = 23;

  enum Flag {
    EXPIRATION_TIMER_UPDATE = 2;
    PROFILE_KEY_UPDATE = 4;
    FORWARD = 8;
  }
}

message AppGroupContextV2 {
  optional bytes master_key = 1;
  optional uint32 revision = 2;
  optional bytes group_change = 3;
}

message AppDelete {
  optional uint64 target_sent_timestamp = 1;
}

// §3, field 11.
message AppEdit {
  optional uint64 target_sent_timestamp = 1;
  optional AppDataMessage data_message = 2;
}

// §5.1. The type must be present, even for DELIVERY.
message AppReceipt {
  enum Kind {
    DELIVERY = 0;
    READ = 1;
    VIEWED = 2;
  }
  optional Kind kind = 1;
  repeated uint64 timestamps = 2; // unpacked
}

// §5.2. The action must be present, even for STARTED.
message AppTyping {
  enum Action {
    STARTED = 0;
    STOPPED = 1;
  }
  optional uint64 timestamp = 1;
  optional Action action = 2;
  optional bytes group_id = 3;
}

// §6. The padding is opaque and ignored by receivers.
message AppNullMessage {
  optional bytes padding = 1;
}

// §3, field 10.
message AppPniSignature {
  optional bytes pni = 1;       // 16-byte raw PNI UUID
  optional bytes signature = 2; // by the PNI identity key over the ACI identity key
}

// SyncMessage, from spec/service/sync.md §2. The members of the upstream
// "content" oneof are plain optional fields here; receivers apply the
// priority order of §2.1.
message AppSyncMessage {
  optional AppSent sent = 1;
  optional Contacts contacts = 2;
  optional Groups groups = 3;
  optional Request request = 4;
  repeated Read read = 5;
  optional Blocked blocked = 6;
  optional AppVerified verified = 7;
  optional bytes padding = 8;
  optional Configuration configuration = 9;
  repeated StickerPackOperation sticker_pack_operation = 10;
  optional Read view_once_open = 11;
  optional FetchLatest fetch_latest = 12;
  optional Keys keys = 13;
  optional AppMessageRequestResponse message_request_response = 14;
  optional bytes outgoing_payment = 15;
  repeated Read viewed = 16;
  reserved 17;
  optional PniChangeNumber pni_change_number = 18;
  optional CallEvent call_event = 19;
  optional bytes call_link_update = 20;
  optional bytes call_log_event = 21;
  optional bytes delete_for_me = 22;
  optional DeviceNameChange device_name_change = 23;
  optional bytes attachment_backfill_request = 24;
  optional bytes attachment_backfill_response = 25;
  optional bytes username_change = 26;

  message Contacts {
    optional AppAttachmentPointer blob = 1;
    optional bool complete = 2 [default = false];
  }
  message Groups {
    optional AppAttachmentPointer blob = 1;
  }
  message Request {
    enum Type {
      UNKNOWN = 0;
      CONTACTS = 1;
      GROUPS = 2;
      BLOCKED = 3;
      CONFIGURATION = 4;
      KEYS = 5;
      reserved 6;
    }
    optional Type type = 1;
  }
  // Read, Viewed and ViewOnceOpen share one shape.
  message Read {
    reserved 1;
    optional uint64 timestamp = 2;
    optional string sender_aci = 3;
    optional bytes sender_aci_binary = 4;
  }
  message Blocked {
    repeated string numbers = 1;
    repeated string acis = 3;
    repeated bytes group_ids = 2;
    repeated bytes acis_binary = 4;
  }
  message Configuration {
    optional bool read_receipts = 1;
    optional bool unidentified_delivery_indicators = 2;
    optional bool typing_indicators = 3;
    reserved 4, 5;
    optional bool link_previews = 6;
  }
  message StickerPackOperation {
    optional bytes pack_id = 1;
    optional bytes pack_key = 2;
    enum Type {
      INSTALL = 0;
      REMOVE = 1;
    }
    optional Type type = 3;
  }
  message FetchLatest {
    enum Type {
      UNKNOWN = 0;
      LOCAL_PROFILE = 1;
      STORAGE_MANIFEST = 2;
      SUBSCRIPTION_STATUS = 3;
    }
    optional Type type = 1;
  }
  message Keys {
    reserved 1, 2;
    optional string account_entropy_pool = 3;
    optional bytes media_root_backup_key = 4;
  }
  message PniChangeNumber {
    optional bytes identity_key_pair = 1;
    optional bytes signed_pre_key = 2;
    optional bytes last_resort_kyber_pre_key = 5;
    optional uint32 registration_id = 3;
    optional string new_e164 = 4;
  }
  message CallEvent {
    optional bytes conversation_id = 1;
    optional uint64 call_id = 2;
    optional uint64 timestamp = 3;
    optional uint32 type = 4;
    optional uint32 direction = 5;
    optional uint32 event = 6;
  }
  message DeviceNameChange {
    reserved 1;
    optional uint32 device_id = 2;
  }
}

// The top-level Verified message (sync.md §2.3).
message AppVerified {
  reserved 1;
  optional string destination_aci = 5;
  optional bytes identity_key = 2;
  enum State {
    DEFAULT = 0;
    VERIFIED = 1;
    UNVERIFIED = 2;
  }
  optional State state = 3;
  optional bytes null_message = 4;
  optional bytes destination_aci_binary = 6;
}

// §8: the sent transcript for one's own other devices.
message AppSent {
  optional string destination_e164 = 1;
  optional uint64 timestamp = 2;
  optional AppDataMessage message = 3;
  optional uint64 expiration_start_timestamp = 4;
  repeated AppUnidentifiedStatus unidentified_status = 5;
  optional bool is_recipient_update = 6;
  optional string destination_service_id = 7;
  reserved 11;
  optional AppEdit edit_message = 10;
  optional bytes destination_service_id_binary = 12;
  optional AppStoryMessage story_message = 8;
  repeated AppStoryMessageRecipient story_message_recipients = 9;
}

message AppUnidentifiedStatus {
  optional bool unidentified = 2;
  optional string destination_service_id = 3;
  optional bytes destination_pni_identity_key = 5;
  optional bytes destination_service_id_binary = 6;
}

// §5.3: the retry receipt's payload, serialized into Content field 8.
message AppDecryptionErrorMessage {
  optional bytes ratchet_key = 1;
  optional uint64 timestamp = 2;
  optional uint32 device_id = 3;
}

// Data-message features, from spec/service/content-features.md §2.

// Attachment pointers, from spec/service/attachments.md §3.1.
message AppAttachmentPointer {
  oneof attachment_identifier {
    fixed64 cdn_id = 1;
    string cdn_key = 15;
  }
  optional bytes client_uuid = 20;
  optional string content_type = 2;
  optional bytes key = 3;
  optional uint32 size = 4;
  optional bytes thumbnail = 5;
  optional bytes digest = 6;
  optional bytes incremental_mac = 19;
  optional uint32 chunk_size = 17;
  optional string file_name = 7;
  optional uint32 flags = 8;
  optional uint32 width = 9;
  optional uint32 height = 10;
  optional string caption = 11;
  optional string blur_hash = 12;
  optional uint64 upload_timestamp = 13;
  optional uint32 cdn_number = 14;
}

message AppBodyRange {
  optional uint32 start = 1;
  optional uint32 length = 2;
  enum Style {
    NONE = 0;
    BOLD = 1;
    ITALIC = 2;
    SPOILER = 3;
    STRIKETHROUGH = 4;
    MONOSPACE = 5;
  }
  oneof associated_value {
    string mention_aci = 3;
    Style style = 4;
    bytes mention_aci_binary = 5;
  }
}

message AppQuote {
  optional uint64 id = 1;
  reserved 2;
  optional string text = 3;
  repeated AppQuotedAttachment attachments = 4;
  optional string author_aci = 5;
  repeated AppBodyRange body_ranges = 6;
  enum Type {
    NORMAL = 0;
    GIFT_BADGE = 1;
    POLL = 2;
  }
  optional Type type = 7;
  optional bytes author_aci_binary = 8;
}

message AppQuotedAttachment {
  optional string content_type = 1;
  optional string file_name = 2;
  optional AppAttachmentPointer thumbnail = 3;
}

message AppReaction {
  optional string emoji = 1;
  optional bool remove = 2;
  reserved 3;
  optional string target_author_aci = 4;
  optional uint64 target_sent_timestamp = 5;
  optional bytes target_author_aci_binary = 6;
}

message AppPreview {
  optional string url = 1;
  optional string title = 2;
  optional AppAttachmentPointer image = 3;
  optional string description = 4;
  optional uint64 date = 5;
}

message AppSticker {
  optional bytes pack_id = 1;
  optional bytes pack_key = 2;
  optional uint32 sticker_id = 3;
  optional AppAttachmentPointer data = 4;
  optional string emoji = 5;
}

message AppSharedContact {
  message Name {
    optional string given_name = 1;
    optional string family_name = 2;
    optional string prefix = 3;
    optional string suffix = 4;
    optional string middle_name = 5;
    reserved 6;
    optional string nickname = 7;
  }
  message Phone {
    enum Type {
      HOME = 1;
      MOBILE = 2;
      WORK = 3;
      CUSTOM = 4;
    }
    optional string value = 1;
    optional Type type = 2;
    optional string label = 3;
  }
  message PostalAddress {
    enum Type {
      HOME = 1;
      WORK = 2;
      CUSTOM = 3;
    }
    optional Type type = 1;
    optional string label = 2;
    optional string street = 3;
    optional string pobox = 4;
    optional string neighborhood = 5;
    optional string city = 6;
    optional string region = 7;
    optional string postcode = 8;
    optional string country = 9;
  }
  message Avatar {
    optional AppAttachmentPointer avatar = 1;
    optional bool is_profile = 2;
  }
  optional Name name = 1;
  repeated Phone number = 3;
  repeated Phone email = 4; // same shape as Phone
  repeated PostalAddress address = 5;
  optional Avatar avatar = 6;
  optional string organization = 7;
}

message AppStoryContext {
  optional string author_aci = 1;
  optional uint64 sent_timestamp = 2;
  optional bytes author_aci_binary = 3;
}

message AppGroupCallUpdate {
  optional string era_id = 1;
}

message AppGiftBadge {
  optional bytes receipt_credential_presentation = 1;
}

message AppPayment {
  message Notification {
    message MobileCoin {
      optional bytes receipt = 1;
    }
    oneof transaction {
      MobileCoin mobile_coin = 1;
    }
    optional string note = 2;
    reserved 1003;
  }
  message Activation {
    enum Type {
      REQUEST = 0;
      ACTIVATED = 1;
    }
    optional Type type = 1;
  }
  oneof item {
    Notification notification = 1;
    Activation activation = 2;
  }
  reserved 1002, 1003;
}

message AppPollCreate {
  optional string question = 1;
  optional bool allow_multiple = 2;
  repeated string options = 3;
}

message AppPollTerminate {
  optional uint64 target_sent_timestamp = 1;
}

message AppPollVote {
  optional bytes target_author_aci_binary = 1;
  optional uint64 target_sent_timestamp = 2;
  repeated uint32 option_indexes = 3;
  optional uint32 vote_count = 4;
}

message AppPinMessage {
  optional bytes target_author_aci_binary = 1;
  optional uint64 target_sent_timestamp = 2;
  oneof pin_duration {
    uint32 pin_duration_seconds = 3;
    bool pin_duration_forever = 4;
  }
}

message AppUnpinMessage {
  optional bytes target_author_aci_binary = 1;
  optional uint64 target_sent_timestamp = 2;
}

message AppAdminDelete {
  optional bytes target_author_aci_binary = 1;
  optional uint64 target_sent_timestamp = 2;
}

// sync.md §2: MessageRequestResponse (SyncMessage field 14).
message AppMessageRequestResponse {
  reserved 1;
  optional string thread_aci = 2;
  optional bytes group_id = 3;
  enum Type {
    UNKNOWN = 0;
    ACCEPT = 1;
    DELETE = 2;
    BLOCK = 3;
    BLOCK_AND_DELETE = 4;
    SPAM = 5;
    BLOCK_AND_SPAM = 6;
  }
  optional Type type = 4;
  optional bytes thread_aci_binary = 5;
}

// A record of the contact stream (sync.md §5.1), length-prefixed in the
// blob and followed by the avatar bytes.
message AppContactDetails {
  optional string number = 1;
  optional string aci = 9;
  optional bytes aci_binary = 13;
  optional string name = 2;
  message Avatar {
    optional string content_type = 1;
    optional uint32 length = 2;
  }
  optional Avatar avatar = 3;
  optional uint32 expire_timer = 8;
  optional uint32 expire_timer_version = 12;
  optional uint32 inbox_position = 10;
  reserved 4, 5, 6, 7, 11;
}

// StoryMessage, Content field 9 (stories.md §1.1).
message AppStoryMessage {
  optional bytes profile_key = 1;
  optional AppGroupContextV2 group = 2;
  oneof attachment {
    AppAttachmentPointer file_attachment = 3;
    AppTextAttachment text_attachment = 4;
  }
  optional bool allows_replies = 5;
  repeated AppBodyRange body_ranges = 6;
}

// stories.md §1.2.
message AppTextAttachment {
  optional string text = 1;
  enum Style {
    DEFAULT = 0;
    REGULAR = 1;
    BOLD = 2;
    SERIF = 3;
    SCRIPT = 4;
    CONDENSED = 5;
  }
  optional Style text_style = 2;
  optional uint32 text_foreground_color = 3;
  optional uint32 text_background_color = 4;
  optional AppPreview preview = 5;
  message Gradient {
    optional uint32 start_color = 1;
    optional uint32 end_color = 2;
    optional uint32 angle = 3;
    repeated uint32 colors = 4;
    repeated float positions = 5;
  }
  oneof background {
    Gradient gradient = 6;
    uint32 color = 7;
  }
}

// SyncMessage.Sent field 9 (stories.md §1.4).
message AppStoryMessageRecipient {
  optional string destination_service_id = 1;
  repeated string distribution_list_ids = 2;
  optional bool is_allowed_to_reply = 3;
  reserved 4;
  optional bytes destination_service_id_binary = 5;
}
