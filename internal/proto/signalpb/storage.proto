// libsignal's serialized records as signal-cli 0.14.7 stores them in
// account.db. Read for offline capture replay and, later, data-dir import.
// Written from spec/protocol/double-ratchet.md §10, sender-keys.md and
// capture.md §2, never copied from upstream.
syntax = "proto3";

package signalcligo;

option go_package = "github.com/aren55555/signal-cli-go/internal/proto/signalpb";

// A session record: the current state plus archived ones.
message StoredSessionRecord {
  StoredSession current = 1;
  repeated bytes previous = 2; // serialized StoredSession, newest first
}

message StoredSession {
  uint32 version = 1;
  bytes local_identity = 2;   // 33 bytes
  bytes remote_identity = 3;  // 33 bytes
  bytes root_key = 4;
  uint32 previous_counter = 5;
  Chain sender_chain = 6;
  repeated Chain receiver_chains = 7; // oldest first
  // 8 is not described by the spec; unknown fields are preserved.
  PendingPreKey pending_pre_key = 9;
  uint32 remote_registration_id = 10;
  uint32 local_registration_id = 11;
  reserved 12;
  bytes alice_base_key = 13;  // the initiator's base key, on both sides
  PendingKyberPreKey pending_kyber_pre_key = 14;
  bytes pq_ratchet_state = 15; // serialized SPQR state

  message Chain {
    bytes ratchet_key = 1;
    bytes ratchet_key_private = 2; // sending chain only
    ChainKey chain_key = 3;
    repeated MessageKey message_keys = 4; // receiving chains only

    message ChainKey {
      uint32 index = 1; // the next index to use
      bytes key = 2;
    }
    message MessageKey {
      uint32 index = 1;
      bytes cipher_key = 2; // legacy form
      bytes mac_key = 3;    // legacy form
      bytes iv = 4;         // legacy form
      bytes seed = 5;       // current form
    }
  }

  message PendingPreKey {
    optional uint32 one_time_pre_key_id = 1;
    bytes base_key = 2;
    int32 signed_pre_key_id = 3;
    uint64 timestamp = 4; // seconds since the Unix epoch
  }

  message PendingKyberPreKey {
    uint32 kyber_pre_key_id = 1;
    bytes ciphertext = 2; // 1569 bytes
  }
}

// A one-time EC prekey.
message StoredPreKey {
  uint32 id = 1;
  bytes public_key = 2;
  bytes private_key = 3;
}

// A signed EC prekey. Kyber prekeys use the same layout, with the
// 1569-byte serialized public key and 3169-byte serialized secret key
// (spec/crypto/kem.md).
message StoredSignedPreKey {
  uint32 id = 1;
  bytes public_key = 2;
  bytes private_key = 3;
  bytes signature = 4;
  fixed64 timestamp = 5; // milliseconds
}

// Sender-key states for one (sender, distribution) pair.
message StoredSenderKeyRecord {
  repeated StoredSenderKeyState states = 1;
}

message StoredSenderKeyState {
  uint32 chain_id = 1;
  ChainKey chain_key = 2;
  SigningKey signing_key = 3;
  repeated ChainKey message_keys = 4; // skipped keys: iteration and seed
  uint32 message_version = 5; // 0 means 3

  message ChainKey {
    uint32 iteration = 1;
    bytes seed = 2;
  }
  message SigningKey {
    bytes public_key = 1;
    bytes private_key = 2; // empty on receivers
  }
}
